name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bbtracker
          POSTGRES_USER: bbtracker
          POSTGRES_PASSWORD: bbtracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bbtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: 'true'
      DATABASE_URL: postgres://bbtracker:bbtracker@localhost:5432/bbtracker
      REDIS_URL: redis://localhost:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system libs (WeasyPrint PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest -q
